<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">Símbolo de Syntropy</title>
  <desc id="desc">Cerebro de dos hemisferios formado por circuitos y nodos. Hemisferio izquierdo rosa y derecho morado.</desc>
  <defs>
    <linearGradient id="syntropy-left" x1="28" y1="40" x2="128" y2="216" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FF478D"/>
      <stop offset="1" stop-color="#E01462"/>
    </linearGradient>
    <linearGradient id="syntropy-right" x1="128" y1="40" x2="228" y2="216" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#8B18D9"/>
      <stop offset="1" stop-color="#6F07C8"/>
    </linearGradient>
    <radialGradient id="syntropy-core" cx="0" cy="0" r="1" gradientTransform="translate(128 128) rotate(90) scale(17)" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F31EDB"/>
      <stop offset="1" stop-color="#CA01CC"/>
    </radialGradient>
    <filter id="syntropy-glow" x="94" y="94" width="68" height="68" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feColorMatrix in="blur" type="matrix" values="0 0 0 0 0.95 0 0 0 0 0.05 0 0 0 0 0.72 0 0 0 0.9 0"/>
    </filter>
  </defs>

  <g stroke-linecap="round" stroke-linejoin="round">
    <!-- Hemisferio izquierdo -->
    <path d="M128 50C112 38 88 40 76 54C58 50 44 64 46 82C30 90 24 108 34 122C24 136 28 154 44 160C42 178 58 192 78 186C84 204 104 212 128 198Z" stroke="url(#syntropy-left)" stroke-width="7.5"/>
    <!-- Hemisferio derecho -->
    <path d="M128 50C144 38 168 40 180 54C198 50 212 64 210 82C226 90 232 108 222 122C232 136 228 154 212 160C214 178 198 192 178 186C172 204 152 212 128 198Z" stroke="url(#syntropy-right)" stroke-width="7.5"/>

    <!-- Circuitos del hemisferio izquierdo -->
    <g stroke="#FF478D" stroke-width="3.6">
      <path d="M128 128H100V100H86"/>
      <path d="M128 128H112V82H102"/>
      <path d="M128 128H108V150H92"/>
      <path d="M128 128H96V116H80"/>
      <path d="M128 128H118V166H106"/>
      <path d="M128 128H88V142H76"/>
    </g>
    <!-- Circuitos del hemisferio derecho -->
    <g stroke="#8B18D9" stroke-width="3.6">
      <path d="M128 128H156V100H170"/>
      <path d="M128 128H144V82H154"/>
      <path d="M128 128H148V150H164"/>
      <path d="M128 128H160V116H176"/>
      <path d="M128 128H138V166H150"/>
      <path d="M128 128H168V142H180"/>
    </g>

    <!-- Nodos terminales -->
    <g fill="#FF478D">
      <circle cx="86" cy="100" r="5.5"/>
      <circle cx="102" cy="82" r="5.5"/>
      <circle cx="92" cy="150" r="5.5"/>
      <circle cx="80" cy="116" r="5.5"/>
      <circle cx="106" cy="166" r="5.5"/>
      <circle cx="76" cy="142" r="5.5"/>
    </g>
    <g fill="#8B18D9">
      <circle cx="170" cy="100" r="5.5"/>
      <circle cx="154" cy="82" r="5.5"/>
      <circle cx="164" cy="150" r="5.5"/>
      <circle cx="176" cy="116" r="5.5"/>
      <circle cx="150" cy="166" r="5.5"/>
      <circle cx="180" cy="142" r="5.5"/>
    </g>

    <!-- Nodo central -->
    <circle cx="128" cy="128" r="25" fill="#CA01CC" opacity="0.22" filter="url(#syntropy-glow)"/>
    <circle cx="128" cy="128" r="14" fill="url(#syntropy-core)"/>
    <circle cx="128" cy="128" r="5" fill="#FFD9F6" opacity="0.72"/>
  </g>
</svg>
